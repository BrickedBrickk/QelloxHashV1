name: Bug Report
description: Report a bug in QelloxHashV1
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a bug in the QelloxHashV1 implementation.
        For algorithm security issues, see the Security section of README.md and contact maintainers privately instead of opening an issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Clear description of the bug"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "Deterministic reproduction steps"
      placeholder: |
        1. cargo build --workspace
        2. cargo test --workspace
        3. See error in ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should happen"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happens"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: "Output of `rustc --version`"
      placeholder: "rustc 1.81.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "OS and version"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Any other relevant information"
    validations:
      required: false
