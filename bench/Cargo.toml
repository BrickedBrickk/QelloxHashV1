[package]
name = "qelloxhash-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "qelloxhash-bench"
path = "src/main.rs"

[dependencies]
qelloxhash-v1-reference = { path = "../reference" }
qelloxhash-v1-gpu = { path = "../gpu" }
sha2 = "=0.10.9"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.3"
hex = "0.4"
wgpu = "0.20"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"